<!doctype html>
<!--
  ============================================================
  كيف تعدّل الموقع  /  HOW TO EDIT
  ============================================================
  الموقع صفحة وحدة: الرئيسية ← أعمالنا ← كيف نعمل ← تواصل
  1) الأرقام والواتساب والانستغرام والفيسبوك والعنوان والخريطة: ابحث عن  const CONFIG.
  2) نصوص الموقع (عربي وإنجليزي): ابحث عن  const T.
  3) الصور: مدمجة داخل الملف بالأسفل (IMG). أرسل لي الصور الجديدة وأدمجها،
     أو ارفع الصور بجانب index.html وضع أسماءها بـ CONFIG.photos (مثل 'kitchen4.jpg').
  4) الألوان: أسود وأبيض. الأسود الأساسي --ink بالـ CSS.
  ملاحظة: الملف لازم يبقى اسمه index.html
  ============================================================
-->
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEST Kitchens & More | مطابخ وديكورات عصرية في بغداد</title>

<meta property="og:description" content="Custom kitchen cabinets, countertops, joinery and interior solutions in Baghdad since 2016.">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%230A0A0A'/%3E%3Ctext x='32' y='45' font-family='Georgia,serif' font-size='40' text-anchor='middle' fill='%23fff'%3EN%3C/text%3E%3C/svg%3E">

<style>
:root{
  --ink:#0A0A0A;
  --soft:#F5F4F1;
  --mut:#55554f;
  --grey:#6F6F6A;
  --line:rgba(10,10,10,.14);
  --hdr-h:64px;
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%;background:#fff}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
body{background:#fff;color:var(--ink);font-family:'IBM Plex Sans Arabic','Inter',system-ui,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased}
[lang=en]{font-family:'Inter','IBM Plex Sans Arabic',system-ui,sans-serif}
[lang=ar]{font-family:'IBM Plex Sans Arabic','Inter',system-ui,sans-serif}
a{color:inherit}
button{font:inherit;color:inherit}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.wrap{max-width:1160px;margin:0 auto;padding:0 clamp(20px,5vw,56px)}
section[id]{scroll-margin-top:var(--hdr-h)}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}

/* ---------- header ---------- */
.site{position:sticky;top:0;z-index:40;height:var(--hdr-h);background:rgba(255,255,255,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.site .wrap{height:100%;display:flex;align-items:center;gap:clamp(12px,3vw,32px)}
.brand{display:grid;text-decoration:none;line-height:1;gap:3px;flex:none}
.brand b{font-family:'Playfair Display',Georgia,serif;font-weight:500;font-size:22px;letter-spacing:.22em;direction:ltr}
.brand small{font-family:'Inter',sans-serif;font-size:6.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--grey);direction:ltr}
.nav{display:flex;gap:2px}
.nav a{position:relative;white-space:nowrap;padding:10px clamp(8px,1.6vw,16px);font-size:14px;font-weight:500;text-decoration:none;color:#6b6b66;transition:color .25s}
.nav a:hover,.nav a[aria-current=true]{color:var(--ink)}
.nav a::after{content:"";position:absolute;inset-inline:clamp(8px,1.6vw,16px);bottom:4px;height:2px;background:var(--ink);transform:scaleX(0);transform-origin:left;transition:transform .45s var(--ease)}
[dir=rtl] .nav a::after{transform-origin:right}
.nav a[aria-current=true]::after{transform:scaleX(1)}
.site .end{margin-inline-start:auto;display:flex;align-items:center;gap:10px}
.lang{min-height:38px;min-width:52px;padding:0 14px;border:1px solid var(--line);background:transparent;border-radius:999px;font-size:13px;font-weight:500;cursor:pointer;transition:background .2s,border-color .2s}
.lang:hover{background:rgba(10,10,10,.05);border-color:var(--ink)}
@media (max-width:520px){.brand b{font-size:18px;letter-spacing:.14em}.brand small{letter-spacing:.2em;font-size:6px}.nav a{padding:10px 6px;font-size:12.5px}.nav a::after{inset-inline:6px}.site .wrap{gap:6px;padding:0 14px}.lang{min-width:42px;padding:0 8px;font-size:12px}}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 30px;font-size:15px;font-weight:600;text-decoration:none;border:1px solid var(--ink);border-radius:2px;cursor:pointer;transition:transform .25s var(--ease),background-color .2s,color .2s,border-color .2s}
.btn:hover{transform:translateY(-2px)}
.btn--solid{background:var(--ink);border-color:var(--ink);color:#fff}
.btn--solid:hover{background:#2b2b2b;border-color:#2b2b2b}
.btn--line{background:transparent;color:var(--ink)}
.btn--line:hover{background:var(--ink);color:#fff}
.btn svg{width:20px;height:20px;flex:none}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}

/* ---------- labels ---------- */
.tag{display:flex;align-items:center;gap:12px;font-family:'Inter',sans-serif;font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--mut)}
.tag i{display:block;width:9px;height:9px;background:var(--ink)}
.tag b{font-weight:600;color:var(--ink);letter-spacing:.14em}
html[lang=ar] .tag{letter-spacing:0;text-transform:none;font-family:'IBM Plex Sans Arabic',sans-serif;font-size:13px}
h2.title{margin-top:14px;font-family:'Playfair Display',Georgia,serif;font-weight:500;font-size:clamp(34px,5.6vw,60px);line-height:1.1}
html[lang=ar] h2.title{font-family:'IBM Plex Sans Arabic',sans-serif;font-weight:600;line-height:1.25}

/* ---------- 01 hero ---------- */
.hero{border-bottom:1px solid var(--line)}
.hero .wrap{display:grid;gap:clamp(28px,5vw,64px);align-items:center;padding-top:clamp(36px,6vw,80px);padding-bottom:clamp(44px,7vw,96px)}
@media (min-width:900px){.hero .wrap{grid-template-columns:1.05fr .95fr}}
.hero h1{margin:22px 0 18px;font-family:'Playfair Display',Georgia,serif;font-weight:500;line-height:1.02;font-size:clamp(44px,8vw,88px)}
html[lang=ar] .hero h1{font-family:'IBM Plex Sans Arabic',sans-serif;font-weight:600;line-height:1.18;font-size:clamp(50px,10vw,104px)}
html[lang=en] .hero h1{text-transform:uppercase;letter-spacing:.03em;font-size:clamp(36px,6.8vw,74px)}
.hero p.lead{max-width:46ch;font-size:clamp(16px,1.9vw,19px);font-weight:300;color:#3f3f3b;line-height:1.9}
.hero-photo{position:relative;width:100%;aspect-ratio:4/5;max-height:660px;overflow:hidden;background:#e6e4df}
.hero-photo .frame{width:100%;height:100%}
.hero-photo img{display:block;width:100%;height:100%;object-fit:cover;transition:scale 1s var(--ease)}
.hero-photo:hover img{scale:1.04}

/* ---------- sections ---------- */
.sec{padding:clamp(64px,9vw,120px) 0}
.sec--soft{background:var(--soft)}

/* 02 work */
.gallery{margin-top:clamp(36px,5vw,56px);display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.gallery figure{margin:0;overflow:hidden;aspect-ratio:4/5;background:#e6e4df}
.gallery .frame{width:100%;height:100%}
.gallery img{display:block;width:100%;height:100%;object-fit:cover;transition:scale .9s var(--ease)}
.gallery figure:hover img{scale:1.05}

/* 03 how we work */
.steps{list-style:none;padding:0;margin-top:clamp(36px,6vw,64px);position:relative;display:grid}
.steps::before{content:"";position:absolute;inset-block:8px;inset-inline-start:23px;width:1px;background:var(--line);transform-origin:top}
.step{position:relative;display:grid;grid-template-columns:48px 1fr;gap:clamp(18px,3vw,36px);padding-bottom:clamp(28px,5vw,48px)}
.step:last-child{padding-bottom:0}
.step .n{position:relative;z-index:1;width:48px;height:48px;display:grid;place-items:center;background:#fff;border:1px solid var(--ink);font-family:'Inter',sans-serif;font-weight:600;font-size:14px;letter-spacing:.06em;direction:ltr;transition:background .35s,color .35s,border-color .35s}
.step:hover .n{background:var(--ink);border-color:var(--ink);color:#fff}
.step h3{font-family:'Playfair Display',Georgia,serif;font-weight:500;font-size:clamp(24px,3vw,30px);line-height:1.2;margin-top:6px}
html[lang=ar] .step h3{font-family:'IBM Plex Sans Arabic',sans-serif;font-weight:600}
.step p{margin-top:6px;color:var(--mut);max-width:34ch;font-size:16px}
@media (min-width:960px){
  .steps{grid-template-columns:repeat(5,1fr);gap:clamp(16px,2vw,32px)}
  .steps::before{display:none}
  .step{grid-template-columns:1fr;gap:0;padding:0;border-top:1px solid var(--ink)}
  .step .n{width:auto;height:auto;display:block;place-items:unset;background:none;border:0;color:var(--ink);padding:20px 0 10px;font-size:13px;letter-spacing:.2em}
  .step:hover .n{background:none;color:var(--ink)}
  .step h3{margin-top:0}
}

/* 04 contact */
.contact{border-top:1px solid var(--line)}
.contact .cols{margin-top:clamp(36px,6vw,64px);display:grid;gap:clamp(28px,4vw,48px)}
@media (min-width:800px){.contact .cols{grid-template-columns:repeat(3,1fr)}}
.col{padding-top:20px;border-top:1px solid var(--ink)}
.col h3{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--grey);font-family:'Inter',sans-serif;font-weight:600;margin-bottom:14px}
html[lang=ar] .col h3{letter-spacing:0;text-transform:none;font-family:'IBM Plex Sans Arabic',sans-serif;font-size:14px}
.col a{display:block;padding:6px 0;text-decoration:none;font-size:clamp(17px,2vw,20px);transition:color .2s,padding .3s var(--ease)}
.col a:hover{color:var(--mut);padding-inline-start:6px}
.foot{margin-top:clamp(56px,8vw,96px);padding-top:22px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;color:var(--grey);font-size:13px}
.foot .brand b{font-size:18px}
.foot{padding-bottom:84px}

/* floating WhatsApp */
.wa{position:fixed;inset-inline-end:18px;bottom:18px;z-index:50;width:58px;height:58px;display:grid;place-items:center;background:var(--ink);color:#fff;border-radius:50%;box-shadow:0 10px 30px rgba(0,0,0,.28);text-decoration:none;transition:transform .25s var(--ease),background .2s}
.wa:hover{transform:scale(1.08);background:#2b2b2b}
.wa svg{width:28px;height:28px}
.wa::before{content:"";position:absolute;inset:-1px;border-radius:50%;border:1px solid var(--ink);opacity:0}

/* ---------- motion ---------- */
@keyframes up{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes wipe{from{clip-path:inset(100% 0 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes settle{from{transform:scale(1.2)}to{transform:scale(1)}}
@keyframes ring{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.7);opacity:0}}
.motion .hero .tag{animation:up .8s var(--ease) .1s backwards}
.motion .hero .tag i{animation:pop .5s cubic-bezier(.34,1.56,.64,1) .3s backwards}
.motion .hero h1{animation:up 1s var(--ease) .25s backwards}
.motion .hero p.lead{animation:up 1s var(--ease) .5s backwards}
.motion .hero-photo .frame{animation:wipe 1.3s var(--ease) .2s backwards}
.motion .hero-photo img{animation:settle 2.4s var(--ease) .2s backwards}
.motion .rv{transition:opacity .85s var(--ease) var(--d,0s),transform .85s var(--ease) var(--d,0s)}
.motion .rv:not(.in){opacity:0;transform:translateY(24px)}
.motion .gallery .frame{transition:clip-path 1.2s var(--ease) var(--d,0s)}
.motion .gallery figure:not(.in) .frame{clip-path:inset(100% 0 0 0)}
.motion .gallery img{transition:transform 1.8s var(--ease) var(--d,0s),scale .9s var(--ease)}
.motion .gallery figure:not(.in) img{transform:scale(1.16)}
.motion .steps::before{transition:transform 1.6s var(--ease) .1s}
.motion .steps:not(.in)::before{transform:scaleY(0)}
@media (min-width:960px){.motion .step{transition:opacity .85s var(--ease) var(--d,0s),transform .85s var(--ease) var(--d,0s),border-color .6s}}
.motion .wa::before{animation:ring 2.6s ease-out 3s infinite}
</style>
</head>
<body>

<header class="site">
  <div class="wrap">
    <a class="brand" href="#home" aria-label="NEST Kitchens &amp; More"><b>NEST</b><small>Kitchens &amp; More</small></a>
    <nav class="nav" aria-label="Sections">
      <a href="#home" data-s="home" data-t="navHome"></a>
      <a href="#how" data-s="how" data-t="navHow"></a>
      <a href="#contact" data-s="contact" data-t="navContact"></a>
    </nav>
    <div class="end">
      <button class="lang" type="button" data-lang-toggle></button>
    </div>
  </div>
</header>

<main>
  <!-- 01 -->
  <section class="hero" id="home">
    <div class="wrap">
      <div>
        <div class="tag"><i></i><b>01</b><span data-t="heroTag"></span></div>
        <h1 data-t="heroTitle"></h1>
        <p class="lead" data-t="heroLead"></p>
      </div>
      <div class="hero-photo"><div class="frame"><img id="heroImg" alt=""></div></div>
    </div>
  </section>

  <!-- 02 -->
  <section class="sec" id="work">
    <div class="wrap">
      <div class="tag rv"><i></i><b>02</b><span data-t="workTag"></span></div>
      <h2 class="title rv" style="--d:.08s" data-t="workTitle"></h2>
      <div class="gallery" id="gallery"></div>
    </div>
  </section>

  <!-- 03 -->
  <section class="sec sec--soft" id="how">
    <div class="wrap">
      <div class="tag rv"><i></i><b>03</b><span data-t="howTag"></span></div>
      <h2 class="title rv" style="--d:.08s" data-t="howTitle"></h2>
      <ol class="steps" id="steps"></ol>
    </div>
  </section>

  <!-- 04 -->
  <section class="sec contact" id="contact">
    <div class="wrap">
      <div class="tag rv"><i></i><b>04</b><span data-t="conTag"></span></div>
      <h2 class="title rv" style="--d:.08s" data-t="conTitle"></h2>
      <div class="cols" id="cols"></div>
      <div class="foot">
        <a class="brand" href="#home" aria-label="NEST Kitchens &amp; More"><b>NEST</b><small>Kitchens &amp; More</small></a>
        <span id="copy"></span>
      </div>
    </div>
  </section>
</main>

<a class="wa" data-wa href="#" target="_blank" rel="noopener" aria-label="WhatsApp"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11.5a8 8 0 0 1-11.9 7L4 20l1.5-4A8 8 0 1 1 20 11.5z"/><path d="M9 8.5c.3 2.6 2.4 4.9 5.5 6l1.2-1.4-1.9-1-.8.6a4.6 4.6 0 0 1-1.9-1.9l.6-.8-1-1.9z"/></svg></a>

<script>
/* ============================================================
   الإعدادات / CONFIG — الأرقام والحسابات والعنوان
   ============================================================ */
const CONFIG = {
  phones: ['07871727374', '07754373447'],                 // أرقام التواصل والحجز
  whatsapp: '07821689374',                                // واتساب الحجز
  instagram: 'co.nestt',
  facebook: 'https://www.facebook.com/share/1DJHGQ7q5d/?mibextid=wwXIfr',
  mapUrl: 'https://maps.app.goo.gl/JFPA4uXTCQSG2Yh9A?g_st=ic',
  address: { ar: 'المنصور، شارع ١٤ رمضان، بغداد، العراق', en: 'Al-Mansour, 14 Ramadan St, Baghdad, Iraq' },
  // صور إضافية تنضاف لقسم "أعمالنا": ضع أسماء الملفات (ارفعها بجانب index.html) مثل ['kitchen4.jpg']
  photos: []
};

/* ============================================================
   النصوص / TEXT  (عربي + إنجليزي)
   ============================================================ */
const T = {
  ar: {
    navHome: 'الرئيسية', navHow: 'كيف نعمل', navContact: 'تواصل', toggle: 'EN',
    heroTag: 'مطابخ وديكورات', heroTitle: 'صُنعت للحياة.',
    heroLead: 'نيست منذ ٢٠١٦ متخصصة في تصميم وتنفيذ المطابخ والديكورات العصرية والكلاسيكية، نقدم أفضل منتج وأفضل خدمة لتناسب كل مساحة وتلبي احتياجات العائلة، مع جودة عالية وخامات مستوردة.',
    heroAlt: 'مطبخ عصري من تنفيذ نيست',
    workTag: 'أعمالنا', workTitle: 'من أعمالنا',
    howTag: 'الخطوات', howTitle: 'كيف نعمل',
    conTag: 'تواصل', conTitle: 'تواصل معنا',
    kPhone: 'تواصل', kLoc: 'موقعنا', kFollow: 'تابعنا', fb: 'فيسبوك',
    waMsg: 'مرحباً نيست، أريد حجز موعد',
    copy: y => `© ${y} نيست للمطابخ والديكور. جميع الحقوق محفوظة.`,
    steps: [
      ['تواصل معنا', 'تواصل مع فريق نيست للبدء.'],
      ['استشارة', 'ناقش رؤيتك مع المختصين لدينا.'],
      ['قياسات', 'نزور مساحتك لأخذ القياسات بدقة.'],
      ['اتفاق', 'الاتفاق على التصميم والخامات والشروط.'],
      ['تسليم', 'استلام مساحتك بالموعد المتفق عليه.']
    ]
  },
  en: {
    navHome: 'Home', navHow: 'How we work', navContact: 'Contact', toggle: 'عربي',
    heroTag: 'Kitchens & Décor', heroTitle: 'Crafted for living.',
    heroLead: 'Since 2016, NEST has specialized in designing and building modern and classic kitchens and décor. We offer the best product and the best service to suit every space and meet every family’s needs — with high quality and imported materials.',
    heroAlt: 'A modern kitchen built by NEST',
    workTag: 'Our work', workTitle: 'Selected work',
    howTag: 'Process', howTitle: 'How we work',
    conTag: 'Contact', conTitle: 'Get in touch',
    kPhone: 'Contact', kLoc: 'Location', kFollow: 'Follow us', fb: 'Facebook',
    waMsg: 'Hello NEST, I would like to book an appointment',
    copy: y => `© ${y} NEST Kitchens & More. All rights reserved.`,
    steps: [
      ['Get in touch', 'Contact the NEST team to get started.'],
      ['Consultation', 'Discuss your vision with our specialists.'],
      ['Measurements', 'We visit your space to take precise measurements.'],
      ['Agreement', 'Agree on the design, materials and terms.'],
      ['Delivery', 'Receive your space on the agreed date.']
    ]
  }
};

/* ============================================================
   الكود / CODE  (ما تحتاج تعدّل بعد هذا الخط)
   ============================================================ */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const intl = n => '+964' + String(n).replace(/^0/, '');
const fmt = n => n.replace(/^(\d{4})(\d{3})(\d{4})$/, '$1 $2 $3');

let lang = 'ar';
try { const s = localStorage.getItem('nest-lang'); if (s === 'en' || s === 'ar') lang = s; } catch (e) {}
const MOTION = document.documentElement.classList.contains('motion');

function render() {
  const L = lang, t = T[L], root = document.documentElement;
  root.lang = L; root.dir = L === 'ar' ? 'rtl' : 'ltr';

  document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t[el.dataset.t]; });
  document.querySelectorAll('[data-lang-toggle]').forEach(b => { b.textContent = t.toggle; b.setAttribute('lang', L === 'ar' ? 'en' : 'ar'); });
  const wa = 'https://wa.me/' + intl(CONFIG.whatsapp).replace('+', '') + '?text=' + encodeURIComponent(t.waMsg);
  document.querySelectorAll('[data-wa]').forEach(a => { a.href = wa; });

  /* hero photo */
  const hi = $('#heroImg'), IM = (typeof IMG !== 'undefined') ? IMG : { work: [], hero: '' };
  if (hi.getAttribute('src') !== IM.hero) hi.src = IM.hero;
  hi.alt = t.heroAlt;

  /* 02 work */
  const photos = [...(IM.work || []).filter(x => x !== IM.hero), ...(CONFIG.photos || [])];
  $('#gallery').innerHTML = photos.map((src, i) =>
    `<figure style="--d:${(i % 3) * 0.12}s"><div class="frame"><img src="${esc(src)}" alt="${esc(t.heroAlt)}"></div></figure>`).join('');
  $('#work').hidden = !photos.length;

  /* 04 steps */
  $('#steps').innerHTML = t.steps.map(([h, p], i) =>
    `<li class="step rv" style="--d:${i * 0.08}s"><span class="n">0${i + 1}</span><div><h3>${esc(h)}</h3><p>${esc(p)}</p></div></li>`).join('');

  /* 04 contact */
  $('#cols').innerHTML = `
    <div class="col rv"><h3>${esc(t.kPhone)}</h3>${CONFIG.phones.map(n => `<a href="tel:${intl(n)}"><span class="ltr">${fmt(n)}</span></a>`).join('')}</div>
    <div class="col rv" style="--d:.08s"><h3>${esc(t.kLoc)}</h3><a href="${CONFIG.mapUrl}" target="_blank" rel="noopener">${esc(CONFIG.address[L])}</a></div>
    <div class="col rv" style="--d:.16s"><h3>${esc(t.kFollow)}</h3><a href="https://instagram.com/${CONFIG.instagram}" target="_blank" rel="noopener"><span class="ltr">@${esc(CONFIG.instagram)}</span></a><a href="${CONFIG.facebook}" target="_blank" rel="noopener">${esc(t.fb)}</a></div>`;
  $('#copy').textContent = t.copy(new Date().getFullYear());

  watch(); spy();
}

/* scroll reveals */
let io = null;
function watch() {
  const els = document.querySelectorAll('.rv:not(.in),.gallery figure:not(.in),.steps:not(.in)');
  if (!MOTION || !('IntersectionObserver' in window)) { els.forEach(el => el.classList.add('in')); return; }
  if (!io) io = new IntersectionObserver(entries => {
    entries.forEach(en => { if (en.isIntersecting) { en.target.classList.add('in'); io.unobserve(en.target); } });
  }, { threshold: 0, rootMargin: '0px 0px -8% 0px' });
  els.forEach(el => io.observe(el));
}

/* nav highlight: home (hero..work), how, contact */
function spy() {
  const y = 64 + 60, top = id => document.getElementById(id).getBoundingClientRect().top;
  let cur = 'home';
  if (top('how') <= y) cur = 'how';
  if (top('contact') <= y || window.innerHeight + window.scrollY >= document.body.scrollHeight - 4) cur = 'contact';
  document.querySelectorAll('.nav a').forEach(a => { if (a.dataset.s === cur) a.setAttribute('aria-current', 'true'); else a.removeAttribute('aria-current'); });
}
let ticking = false;
addEventListener('scroll', () => { if (!ticking) { ticking = true; requestAnimationFrame(() => { spy(); ticking = false; }); } }, { passive: true });

document.addEventListener('click', e => {
  if (e.target.closest('[data-lang-toggle]')) {
    lang = lang === 'ar' ? 'en' : 'ar';
    try { localStorage.setItem('nest-lang', lang); } catch (err) {}
    render();
  }
});

/* IMG (الصور) is defined in the last script tag, so start after the page is parsed */
document.addEventListener('DOMContentLoaded', render);
